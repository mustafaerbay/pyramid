# Pyramid — full stack in containers: Postgres + Go API + Svelte frontend.
#
#   docker compose up -d --build      # or: make docker-up
#   open http://localhost:3000
#
# Postgres loads db/schema.sql automatically on first start (empty volume).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pyramid
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-load the schema on first initialization of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pyramid"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      PORT: "8080"
      DB_HOST: db
      # Container-to-container: the db service listens on 5432 inside the
      # network (5433 is only the host-published port).
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pyramid
      DB_SSLMODE: disable
      CORS_ORIGIN: http://localhost:3000
      # From a local, git-ignored .env: SESSION_SECRET (32+ chars) keeps you
      # signed in across restarts; ADMIN_EMAIL + ADMIN_PASSWORD make the first
      # admin account on start if it doesn't exist.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # URL the browser uses to reach the API (baked into the client bundle).
        VITE_API_URL: http://localhost:8080
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  pgdata:
