openapi: 3.0.3
info:
  title: Pyramid API
  version: 0.1.0
  description: >
    All-in-one management system for a software department.
    This OpenAPI document is the single source of truth for the API contract:
    Go server types (Gin) and TypeScript client types (Svelte) are both
    generated from it, so the two stay in lockstep.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
  - name: people
  - name: projects
  - name: project-members
  - name: project-kickoffs
  - name: milestones
  - name: versions
    description: Project versions (releases) that milestones are planned into
  - name: weekly-summaries
  - name: tasks
  - name: goals
  - name: leave
  - name: contributions

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in
      description: Checks email and password and sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: Wrong email or password, or the account is turned off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts; try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/options:
    get:
      operationId: getAuthOptions
      tags: [auth]
      summary: What the sign-in page can offer
      security: []
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOptions"
  /api/v1/auth/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Email a one-time reset link (always answers the same)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPassword"
      responses:
        "204":
          description: If the email has an account and email is on, a link was sent
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password with a reset link's token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPassword"
      responses:
        "204":
          description: Password set; sign in with it
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "204":
          description: Session cookie cleared
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in user
      responses:
        "200":
          description: Current user and their person record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change your own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [auth]
      summary: Your notifications, newest first (latest 50)
      responses:
        "200":
          description: Notifications and how many are unread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /api/v1/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [auth]
      summary: Mark one of your notifications read
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Marked read
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [auth]
      summary: Mark all your notifications read
      responses:
        "204":
          description: All marked read
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List sign-in accounts (admin)
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "403":
          description: Admins only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createUser
      tags: [auth]
      summary: Give a person a sign-in account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      tags: [auth]
      summary: Change an account's role, turn it off/on, or reset its password (admin)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List people
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PersonStatus"
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/people/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person by id
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/people/{id}/workload:
    get:
      operationId: getPersonWorkload
      tags: [people, capacity]
      summary: One person's planned man-days per month for a year
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: year
          in: query
          required: false
          description: Defaults to the current year.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Twelve months, January first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonWorkload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by id
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/project-members:
    get:
      operationId: listProjectMembers
      tags: [project-members]
      summary: List project memberships
      description: >
        Filter by projectId to see a project's team, or by personId to see
        every project a person is assigned to (useful for spotting
        over-allocation before adding someone to another project).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: personId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectRole"
      responses:
        "200":
          description: A page of project memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProjectMember
      tags: [project-members]
      summary: Assign a person to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/project-members/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getProjectMember
      tags: [project-members]
      summary: Get a project membership by id
      responses:
        "200":
          description: The project membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateProjectMember
      tags: [project-members]
      summary: Update a project membership (role, allocation, or departure date)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteProjectMember
      tags: [project-members]
      summary: Remove a person from a project
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/project-kickoffs:
    get:
      operationId: listProjectKickoffs
      tags: [project-kickoffs]
      summary: List project kickoffs
      description: >
        Filter by projectId to check for/fetch the one kickoff record a
        project has (project_id is unique — there is at most one per
        project).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of project kickoffs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKickoffList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProjectKickoff
      tags: [project-kickoffs]
      summary: Record a project's kickoff meeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectKickoffCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKickoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/project-kickoffs/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getProjectKickoff
      tags: [project-kickoffs]
      summary: Get a project kickoff by id
      responses:
        "200":
          description: The project kickoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKickoff"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateProjectKickoff
      tags: [project-kickoffs]
      summary: Update a project kickoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectKickoffUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectKickoff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteProjectKickoff
      tags: [project-kickoffs]
      summary: Delete a project kickoff
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List milestones
      description: >
        Filter by projectId to see a single project's milestones (the usual
        case — the project dashboard's monthly timeline uses this).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MilestoneStatus"
      responses:
        "200":
          description: A page of milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Create a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getMilestone
      tags: [milestones]
      summary: Get a milestone by id
      responses:
        "200":
          description: The milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateMilestone
      tags: [milestones]
      summary: Update a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      summary: Delete a milestone
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/versions:
    get:
      operationId: listVersions
      tags: [versions]
      summary: List project versions
      description: >
        Filter by projectId to see a single project's versions (the usual
        case). Ordered by target date (undated last), then name.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createVersion
      tags: [versions]
      summary: Create a version
      description: New versions always start as `planned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: A version with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/versions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getVersion
      tags: [versions]
      summary: Get a version by id
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateVersion
      tags: [versions]
      summary: Update a version
      description: >
        Setting status to `released` stamps releasedAt with today unless it
        is already set or given in the same request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A version with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteVersion
      tags: [versions]
      summary: Delete a version
      description: Its milestones are kept and become unassigned (versionId null).
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/weekly-summaries:
    get:
      operationId: listWeeklySummaries
      tags: [weekly-summaries]
      summary: List weekly summaries
      description: >
        Filter by projectId to see a single project's weekly summary log
        (the usual case). Results are returned most-recent-week first.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of weekly summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySummaryList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createWeeklySummary
      tags: [weekly-summaries]
      summary: Create a weekly summary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklySummaryCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklySummary"
