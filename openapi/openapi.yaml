      properties:
        taskCount:
          type: integer
        doneCount:
          type: integer
        points:
          type: number
          format: double
        donePoints:
          type: number
          format: double
        manDays:
          type: number
          format: double
        doneManDays:
          type: number
          format: double

    Sprint:
      type: object
      required: [id, projectId, teamId, name, goal, status, startDate, endDate, stats, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
          nullable: true
          description: The project team the sprint belongs to (none = whole project).
        name:
          type: string
        goal:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SprintStatus"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        stats:
          $ref: "#/components/schemas/SprintStats"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SprintCreate:
      type: object
      required: [projectId, name, startDate, endDate]
      properties:
        projectId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        goal:
          type: string
        status:
          $ref: "#/components/schemas/SprintStatus"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SprintUpdate:
      type: object
      properties:
        teamId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        goal:
          type: string
        status:
          $ref: "#/components/schemas/SprintStatus"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SprintList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Sprint"

    SprintDay:
      type: object
      required: [date, scopeCount, doneCount, scopePoints, donePoints, scopeManDays, doneManDays]
      description: The sprint's items at the end of that day.
      properties:
        date:
          type: string
          format: date
        scopeCount:
          type: integer
        doneCount:
          type: integer
        scopePoints:
          type: number
          format: double
        donePoints:
          type: number
          format: double
        scopeManDays:
          type: number
          format: double
        doneManDays:
          type: number
          format: double

    SprintActivity:
      type: string
      enum: [development, testing, design, documentation, deployment, requirements]

    SprintCapacitySetting:
      type: object
      required: [personId]
      properties:
        personId:
          type: string
          format: uuid
        daysOff:
          type: integer
          minimum: 0
          maximum: 60
          description: Working days off in this sprint besides approved leave.
        perDay:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1.5
          description: Man-days a working day (null = from the person's monthly capacity).
        activity:
          allOf:
            - $ref: "#/components/schemas/SprintActivity"
          nullable: true

    SprintCapacitySettings:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SprintCapacitySetting"

    SprintCapacity:
      type: object
      required: [personId, availableManDays, plannedManDays, leaveDays, daysOff, perDay, activity]
      properties:
        personId:
          type: string
          format: uuid
        availableManDays:
          type: number
          format: double
          description: Working days in the sprint outside approved leave, at the person's monthly capacity.
        plannedManDays:
          type: number
          format: double
          description: Their man-days on items in this sprint.
        leaveDays:
          type: integer
        daysOff:
          type: integer
          description: Extra days off set for this sprint.
        perDay:
          type: number
          format: double
          nullable: true
        activity:
          allOf:
            - $ref: "#/components/schemas/SprintActivity"
          nullable: true

    SprintReport:
      type: object
      required: [sprint, days, capacity]
      properties:
        sprint:
          $ref: "#/components/schemas/Sprint"
        days:
          type: array
          description: One entry per day from the start date up to today or the end date, whichever is first.
          items:
            $ref: "#/components/schemas/SprintDay"
        capacity:
          type: array
          description: Project team members and anyone with work in the sprint.
          items:
            $ref: "#/components/schemas/SprintCapacity"

    Process:
      type: object
      required: [workflow, workItemTypes, customFields, rules, boardSettings]
      properties:
        workflow:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowState"
        workItemTypes:
          type: array
          items:
            $ref: "#/components/schemas/WorkItemTypeDef"
        customFields:
          type: array
          items:
            $ref: "#/components/schemas/CustomField"
        rules:
          $ref: "#/components/schemas/WorkItemRules"
        boardSettings:
          $ref: "#/components/schemas/BoardSettings"

    ProcessTemplate:
      type: object
      required: [id, name, description, process, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        process:
          $ref: "#/components/schemas/Process"
        createdAt:
          type: string
          format: date-time

    ProcessTemplateCreate:
      type: object
      required: [name, fromProjectId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: string
        fromProjectId:
          type: string
          format: uuid

    ProcessTemplateList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProcessTemplate"

    ApplyProcess:
      type: object
      description: Give exactly one of templateId and fromProjectId.
      properties:
        templateId:
          type: string
          format: uuid
        fromProjectId:
          type: string
          format: uuid

    ProjectTeam:
      type: object
      required: [id, projectId, name, memberIds, areaIds]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        areaIds:
          type: array
          description: Area paths the team owns (their sub-areas too).
          items:
            type: string
            format: uuid

    ProjectTeamInput:
      type: object
      required: [name]
      properties:
        projectId:
          type: string
          format: uuid
          description: Needed when creating.
        name:
          type: string
          minLength: 1
          maxLength: 60
        memberIds:
          type: array
          items:
            type: string
            format: uuid
        areaIds:
          type: array
          items:
            type: string
            format: uuid

    ProjectTeamList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTeam"

    Area:
      type: object
      required: [id, projectId, path]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        path:
          type: string
          description: Levels separated by "/", e.g. "Web/Checkout" (1–4 levels, 40 characters each).

    AreaCreate:
      type: object
      required: [projectId, path]
      properties:
        projectId:
          type: string
          format: uuid
        path:
          type: string

    AreaUpdate:
      type: object
      required: [path]
      properties:
        path:
          type: string

    AreaList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Area"

    QueryFilters:
      type: object
      description: Every list given must match (an item matches a list if it has any of its values). Empty or missing = any.
      properties:
        projectIds:
          type: array
          description: Any of these projects.
          items:
            type: string
            format: uuid
        types:
          type: array
          items:
            $ref: "#/components/schemas/TaskType"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/TaskStatus"
        priorities:
          type: array
          items:
            $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: Assigned to any of these people.
          items:
            type: string
            format: uuid
        unassigned:
          type: boolean
          description: Only items with no one assigned.
        tags:
          type: array
          description: Has any of these tags (ignoring case).
          items:
            type: string
        sprintIds:
          type: array
          description: In any of these sprints.
          items:
            type: string
            format: uuid
        areaIds:
          type: array
          description: In any of these areas or their sub-areas.
          items:
            type: string
            format: uuid
        text:
          type: string
          description: Title contains this (ignoring case).
        dueAfter:
          type: string
          format: date
          description: Due on or after this day.
        dueBefore:
          type: string
          format: date
          description: Due on or before this day.
        where:
          $ref: "#/components/schemas/QueryGroup"
        tree:
          type: boolean
          description: Also return the children (and their children) of every match, after it.
        childWhere:
          $ref: "#/components/schemas/QueryGroup"

    QueryGroup:
      type: object
      description: >
        Conditions joined with AND (match all) or OR (match any); groups nest
        up to 3 deep, with up to 50 conditions in all.
      required: [match, conditions]
      properties:
        match:
          type: string
          enum: [all, any]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/QueryCondition"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/QueryGroup"

    QueryCondition:
      type: object
      required: [field, op]
      properties:
        field:
          type: string
          description: >
            title, description, state, status, type, priority, assignee, tag,
            sprint, area (and its sub-areas), project, parent, storyPoints,
            manDays, remaining, dueDate, startDate, createdAt, or
            custom:<field key>.
        op:
          type: string
          enum: [eq, ne, contains, not_contains, gt, gte, lt, lte, empty, not_empty]
        value:
          type: string
          description: Dates are YYYY-MM-DD or @today, @today-7, @today+14.

    QueryResult:
      type: object
      required: [data, total, truncated]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
        truncated:
          type: boolean
          description: True when more than 500 items matched; only the first 500 are returned.
        childIds:
          type: array
          description: In a tree query, the items that are only there as children of a match.
          items:
            type: string
            format: uuid

    QueryGroupBy:
      type: string
      enum: [status, assignee, type, priority, project]

    SavedQuery:
      type: object
      required: [id, name, filters, groupBy, shared, ownerPersonId, mine, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        filters:
          $ref: "#/components/schemas/QueryFilters"
        groupBy:
          $ref: "#/components/schemas/QueryGroupBy"
        shared:
          type: boolean
          description: Everyone can see and run it; only its owner can change it.
        ownerPersonId:
          type: string
          format: uuid
          nullable: true
        mine:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SavedQueryInput:
      type: object
      required: [name, filters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        filters:
          $ref: "#/components/schemas/QueryFilters"
        groupBy:
          $ref: "#/components/schemas/QueryGroupBy"
        shared:
          type: boolean

    SavedQueryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SavedQuery"

    Attachment:
      type: object
      required: [id, taskId, filename, mimeType, sizeBytes, uploadedByPersonId, isImage, url, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        filename:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedByPersonId:
          type: string
          format: uuid
          nullable: true
        isImage:
          type: boolean
          description: A PNG, JPEG, GIF or WebP image that can be previewed.
        url:
          type: string
          description: Download path in the app.
        createdAt:
          type: string
          format: date-time

    AttachmentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    FlowDay:
      type: object
      required: [date, counts]
      properties:
        date:
          type: string
          format: date
        counts:
          type: object
          description: Items in each status at the end of the day (cancelled left out).
          additionalProperties:
            type: integer

    FlowItem:
      type: object
      required: [taskId, number, title, type, completedAt, leadDays, cycleDays]
      properties:
        taskId:
          type: string
          format: uuid
        number:
          type: integer
        title:
          type: string
        type:
          $ref: "#/components/schemas/TaskType"
        completedAt:
          type: string
          format: date-time
        leadDays:
          type: number
          format: double
          description: Created to done, in days.
        cycleDays:
          type: number
          format: double
          nullable: true
          description: First "in progress" to done, in days (null when never in progress on record).

    ProjectFlow:
      type: object
      required: [days, completed]
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/FlowDay"
        completed:
          type: array
          description: Items finished in the period, latest first.
          items:
            $ref: "#/components/schemas/FlowItem"

    TagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: string

    TaskAssignment:
      type: object
      required: [personId, manDays]
      properties:
        personId:
          type: string
          format: uuid
        manDays:
          type: number
          format: double
          minimum: 0
          maximum: 999
        availableDays:
          type: integer
          nullable: true
          readOnly: true
          description: >
            Working days (Mon–Fri, minus the person's approved leave) between
            the task's start and due dates. Null when the task doesn't have
            both dates. manDays above this means the share can't be done in
            time. Ignored on input.

    CapacityReport:
      type: object
      required: [month, workingDays, capacityManDays, plannedManDays, people, projects]
      properties:
        month:
          type: string
          description: YYYY-MM
          example: "2026-11"
        workingDays:
          type: integer
          description: Mon–Fri days in the month.
        capacityManDays:
          type: number
          format: double
          description: >
            Sum of the people's capacity for this month (active and on-leave
            people), after taking out their approved leave days.
        plannedManDays:
          type: number
          format: double
          description: Man-days of non-cancelled tasks (on non-cancelled projects) falling in this month.
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonCapacity"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectLoad"

    PersonCapacity:
      type: object
      required: [personId, capacityManDays, leaveDays, plannedManDays]
      properties:
        personId:
          type: string
          format: uuid
        capacityManDays:
          type: number
          format: double
          description: >
            monthlyCapacityManDays × (working days − leave days) ÷ working days.
        leaveDays:
          type: integer
          description: Mon–Fri days of approved leave in this month.
        plannedManDays:
          type: number
          format: double

    ProjectLoad:
      type: object
      required: [projectId, plannedManDays]
      properties:
        projectId:
          type: string
          format: uuid
        plannedManDays:
          type: number
          format: double

    PersonWorkload:
      type: object
      required: [personId, year, capacityManDays, months]
      properties:
        personId:
          type: string
          format: uuid
        year:
          type: integer
        capacityManDays:
          type: number
          format: double
          description: The person's monthly capacity before leave.
        months:
          type: array
          items:
            $ref: "#/components/schemas/PersonWorkloadMonth"

    PersonWorkloadMonth:
      type: object
      required: [month, workingDays, leaveDays, capacityManDays, plannedManDays, projects, tasks]
      properties:
        month:
          type: string
          description: YYYY-MM
        workingDays:
          type: integer
        leaveDays:
          type: integer
          description: Mon–Fri days of approved leave in this month.
        capacityManDays:
          type: number
          format: double
          description: >
            Capacity for this month after approved leave: monthly capacity ×
            (working days − leave days) ÷ working days.
        plannedManDays:
          type: number
          format: double
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectLoad"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/PersonWorkloadTask"

    PersonWorkloadTask:
      type: object
      required: [taskId, projectId, title, status, manDays, monthManDays]
      properties:
        taskId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        manDays:
          type: number
          format: double
          description: This person's man-days on the task (all months).
        monthManDays:
          type: number
          format: double
          description: >
            The part of manDays that falls in this month. Spread over the
            working days in the task's window the person isn't on leave.
        startDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        availableDays:
          type: integer
          nullable: true
          description: >
            Working days the person isn't on leave between the task's start
            and due dates (null without both dates). manDays above this
            means the task can't be done in time.

    TaskList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        pagination:
          $ref: "#/components/schemas/Pagination"

