            $ref: "#/components/schemas/LeaveRequest"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Contributions ----
    ContributionType:
      type: string
      enum:
        [
          commit,
          pull_request,
          code_review,
          issue,
          design,
          documentation,
          deployment,
          support,
          other,
        ]

    Contribution:
      type: object
      required: [id, personId, type, weight, occurredAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: "#/components/schemas/ContributionType"
        title:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        weight:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    ContributionCreate:
      type: object
      required: [personId, type]
      properties:
        personId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ContributionType"
        title:
          type: string
        url:
          type: string
        weight:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time

    ContributionUpdate:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ContributionType"
        title:
          type: string
        url:
          type: string
        weight:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time

    ContributionList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contribution"
        pagination:
          $ref: "#/components/schemas/Pagination"
