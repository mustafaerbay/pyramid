        description:
          type: string
          minLength: 1
        ownerId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid

    ProjectKickoff:
      type: object
      required: [id, projectId, actionItems, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        meetingDate:
          type: string
          format: date
          nullable: true
        facilitatorId:
          type: string
          format: uuid
          nullable: true
        attendees:
          type: string
          nullable: true
        businessProblem:
          type: string
          nullable: true
        successDefinition:
          type: string
          nullable: true
        primaryUsers:
          type: string
          nullable: true
        painPoints:
          type: string
          nullable: true
        mvpFeature:
          type: string
          nullable: true
        constraintsNotes:
          type: string
          nullable: true
        biggestRisk:
          type: string
          nullable: true
        signOffOwner:
          type: string
          nullable: true
        meetingCadence:
          type: string
          nullable: true
        primaryTools:
          type: string
          nullable: true
        nextSessionDate:
          type: string
          format: date
          nullable: true
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/KickoffActionItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectKickoffCreate:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          format: uuid
        meetingDate:
          type: string
          format: date
        facilitatorId:
          type: string
          format: uuid
        attendees:
          type: string
        businessProblem:
          type: string
        successDefinition:
          type: string
        primaryUsers:
          type: string
        painPoints:
          type: string
        mvpFeature:
          type: string
        constraintsNotes:
          type: string
        biggestRisk:
          type: string
        signOffOwner:
          type: string
        meetingCadence:
          type: string
        primaryTools:
          type: string
        nextSessionDate:
          type: string
          format: date
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/KickoffActionItemInput"

    ProjectKickoffUpdate:
      type: object
      properties:
        meetingDate:
          type: string
          format: date
        facilitatorId:
          type: string
          format: uuid
        attendees:
          type: string
        businessProblem:
          type: string
        successDefinition:
          type: string
        primaryUsers:
          type: string
        painPoints:
          type: string
        mvpFeature:
          type: string
        constraintsNotes:
          type: string
        biggestRisk:
          type: string
        signOffOwner:
          type: string
        meetingCadence:
          type: string
        primaryTools:
          type: string
        nextSessionDate:
          type: string
          format: date
        actionItems:
          type: array
          description: >
            Present (even as an empty array) replaces the whole action-item
            set. Omit the field entirely to leave existing action items
            untouched — same replace-whole-set convention as
            TaskUpdate.assigneeIds.
          items:
            $ref: "#/components/schemas/KickoffActionItemInput"

    ProjectKickoffList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectKickoff"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Milestones ----
    MilestoneStatus:
      type: string
      enum: [pending, in_progress, completed, missed]

    Milestone:
      type: object
      required: [id, projectId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MilestoneStatus"
        startDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        completedAt:
          type: string
          format: date
          nullable: true
        versionId:
          type: string
          format: uuid
          nullable: true
          description: The version (release) this milestone is planned into.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MilestoneCreate:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        versionId:
          type: string
          format: uuid
          description: Must belong to the same project (400 otherwise).

    MilestoneUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MilestoneStatus"
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date
        versionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Omit to leave unchanged, send null to unassign, or a version id of
            the same project (400 otherwise).

    MilestoneList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Versions ----
    VersionStatus:
      type: string
      enum: [planned, in_progress, released, cancelled]

    Version:
      type: object
      required: [id, projectId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/VersionStatus"
        targetDate:
          type: string
          format: date
          nullable: true
        releasedAt:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VersionCreate:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        targetDate:
          type: string
          format: date

    VersionUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: "#/components/schemas/VersionStatus"
        targetDate:
          type: string
          format: date
        releasedAt:
          type: string
          format: date

    VersionList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Weekly summaries ----
    WeeklySummary:
      type: object
      required: [id, projectId, weekOf, summary, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        weekOf:
          type: string
          format: date
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WeeklySummaryCreate:
      type: object
      required: [projectId, weekOf, summary]
      properties:
        projectId:
          type: string
          format: uuid
        weekOf:
          type: string
          format: date
        summary:
          type: string
          minLength: 1

    WeeklySummaryUpdate:
      type: object
      properties:
        weekOf:
          type: string
          format: date
        summary:
          type: string
          minLength: 1

    WeeklySummaryList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WeeklySummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Tasks ----
    TaskType:
      type: string
      enum: [epic, feature, story, task, bug]
      description: >
        Work item type. Levels from top: epic, feature, story and bug,
        task. A child can't be a higher level than its parent.

    TaskStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, blocked, done, cancelled]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    Task:
      type: object
      required: [id, projectId, rank, number, type, state, boardDone, title, status, priority, assigneeIds, assignments, manDays, tags, blockedByIds, relatedIds, duplicateOfId, customValues, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
          description: >
            The work item this one sits under (same project, up to 5 levels,
            never a loop, never under a lower-level type).
            A task that has subtasks doesn't count its own man-days toward
            capacity; its subtasks carry the work.
        rank:
          type: number
          format: double
          description: Manual order within the project, lower first. Change it with POST /tasks/{id}/move.
        number:
          type: integer
          description: Per-project sequential number, e.g. 42 for "PYR-42".
        type:
          $ref: "#/components/schemas/TaskType"
        sprintId:
          type: string
          format: uuid
          nullable: true
          description: The sprint this item is planned in (same project).
        areaId:
          type: string
          format: uuid
          nullable: true
          description: The area path this item belongs to (same project).
        customValues:
          type: object
          description: Values of the project's custom fields, by key (text, number or YYYY-MM-DD; a select's option).
          additionalProperties: {}
        state:
          type: string
          description: The item's state in its project's workflow; status is that state's category.
        customType:
          type: string
          nullable: true
          description: One of the project's own types (key); type is then its base.
        customTypeLabel:
          type: string
          nullable: true
          readOnly: true
        customTypeColor:
          allOf:
            - $ref: "#/components/schemas/WorkItemTypeColor"
          nullable: true
          readOnly: true
        boardDone:
          type: boolean
          description: In the Done half of a split board column (cleared when the state changes).
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: People assigned to this task. Empty array means unassigned.
          items:
            type: string
            format: uuid
        assignments:
          type: array
          description: Each assignee's share of the task's man-days.
          items:
            $ref: "#/components/schemas/TaskAssignment"
        estimateManDays:
          type: number
          format: double
          nullable: true
          description: The task's man-day size as entered on the task itself, before (or without) splitting it across assignees.
        manDays:
          type: number
          format: double
          description: >
            Total man-days: the sum of assignments when they carry any
            man-days, otherwise estimateManDays (0 when neither). Computed
            server-side.
        storyPoints:
          type: number
          format: double
          nullable: true
          description: Relative size in points (0–999).
        remainingManDays:
          type: number
          format: double
          nullable: true
          description: Work left, in man-days (0–9999). Set to 0 when the item is done.
        completedManDays:
          type: number
          format: double
          nullable: true
          description: Work done so far, in man-days (0–9999).
        startDate:
          type: string
          format: date
          nullable: true
          description: Planned start; man-days are spread over the working days from startDate to dueDate.
        dueDate:
          type: string
          format: date
          nullable: true
        blockedByIds:
          type: array
          description: >
            Tasks that must be finished before this one can be (same
            project). Sorted by task number.
          items:
            type: string
            format: uuid
        relatedIds:
          type: array
          description: Tasks linked as related (both ways, same project), by task number.
          items:
            type: string
            format: uuid
        duplicateOfId:
          type: string
          format: uuid
          nullable: true
          description: The task this one is a copy of (same project).
        tags:
          type: array
          description: The task's tags, sorted alphabetically (case-insensitive). Tags are shared across all projects.
          items:
            type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required: [projectId, title]
      properties:
        projectId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: Put this under that work item (same project; see Task.parentId for the rules).
        type:
          $ref: "#/components/schemas/TaskType"
        sprintId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        customValues:
          type: object
          additionalProperties: {}
        state:
          type: string
          description: A state of the project's workflow (sets status); otherwise the first state of status's category.
        customType:
          type: string
          description: One of the project's own types (sets type to its base).
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: People to assign at creation. Defaults to none if omitted.
          items:
            type: string
            format: uuid
        assignments:
          type: array
          description: >
            Replaces the full assignee set with these people and man-days.
            Takes precedence over assigneeIds when both are sent.
          items:
            $ref: "#/components/schemas/TaskAssignment"
        estimateManDays:
          type: number
          format: double
          minimum: 0
          maximum: 9999
        storyPoints:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 999
        remainingManDays:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 9999
        completedManDays:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 9999
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        blockedByIds:
          type: array
          description: >
            Tasks this one waits on. Every id must be another task in the same
            project, and the links may not form a loop.
          maxItems: 50
          items:
            type: string
            format: uuid
        relatedIds:
          type: array
          description: Replaces the related links when present (empty array clears).
          maxItems: 50
          items:
            type: string
            format: uuid
        duplicateOfId:
          type: string
          format: uuid
          nullable: true
          description: Mark as a copy of that task; null clears.
        tags:
          type: array
          description: >
            Tags to put on the task. Defaults to none. Each tag is trimmed, 1–40 characters; duplicates
            (ignoring case) are dropped; at most 20 tags. A tag that
            matches an existing one ignoring case reuses its spelling.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40

    TaskUpdate:
      type: object
      properties:
        milestoneId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
          description: >
            Set to put this under that work item (see Task.parentId for the
            rules), null to make it top-level again, or omit to leave
            unchanged.
        type:
          $ref: "#/components/schemas/TaskType"
        sprintId:
          type: string
          format: uuid
          nullable: true
          description: Plan in this sprint; null takes it out of its sprint.
        areaId:
          type: string
          format: uuid
          nullable: true
          description: Set the area; null clears it.
        customValues:
          type: object
          description: Replaces all custom values when present.
          additionalProperties: {}
        state:
          type: string
          description: Move to this workflow state (sets status). Sending only status picks the first state of that category.
        customType:
          type: string
          nullable: true
          description: One of the project's own types (sets type to its base); null clears it.
        boardDone:
          type: boolean
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: >
            Replaces the full assignee set when present — send every
            assignee the task should have, or an empty array to unassign
            everyone. Omit the field entirely to leave assignees unchanged.
          items:
            type: string
            format: uuid
        assignments:
          type: array
          description: >
            Replaces the full assignee set with these people and man-days.
            Takes precedence over assigneeIds when both are sent.
          items:
            $ref: "#/components/schemas/TaskAssignment"
        estimateManDays:
          type: number
          format: double
          minimum: 0
          maximum: 9999
        storyPoints:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 999
          description: Send null to clear.
        remainingManDays:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 9999
        completedManDays:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 9999
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        blockedByIds:
          type: array
          description: >
            Replaces the full set when present (empty array clears it); omit to leave unchanged. Every id must be another task in the same
            project, and the links may not form a loop.
          maxItems: 50
          items:
            type: string
            format: uuid
        relatedIds:
          type: array
          description: Replaces the related links when present (empty array clears).
          maxItems: 50
          items:
            type: string
            format: uuid
        duplicateOfId:
          type: string
          format: uuid
          nullable: true
          description: Mark as a copy of that task; null clears.
        tags:
          type: array
          description: >
            Replaces the task's full tag set when present (an empty array removes all tags). Omit to leave tags unchanged. Each tag is trimmed, 1–40 characters; duplicates
            (ignoring case) are dropped; at most 20 tags. A tag that
            matches an existing one ignoring case reuses its spelling.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40

    SystemRole:
      type: string
      enum: [admin, manager, member, viewer]
      description: >
        admin: everything, including accounts. manager: everything but
        accounts. member: can't change people or approve leave. viewer:
        read-only.

    AuthOptions:
      type: object
      required: [emailReset]
      properties:
        emailReset:
          type: boolean
          description: Whether "forgot password" can email a link (SMTP is set up).

    ForgotPassword:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPassword:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    User:
      type: object
      required: [id, personId, email, role, isActive, createdAt]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/SystemRole"
        isActive:
          type: boolean
          description: False means the account can't sign in.
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [personId, password]
      properties:
        personId:
          type: string
          format: uuid
        email:
          type: string
          description: Sign-in email; defaults to the person's email.
        role:
          $ref: "#/components/schemas/SystemRole"
        password:
          type: string
          minLength: 8
          description: First password; the person can change it after signing in.

    UserUpdate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/SystemRole"
        isActive:
          type: boolean
        password:
          type: string
          minLength: 8
          description: Sets a new password (e.g. when someone forgot theirs).

    UserList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    AuthMe:
      type: object
      required: [user, person]
      properties:
        user:
          $ref: "#/components/schemas/User"
        person:
          $ref: "#/components/schemas/Person"

    TaskComment:
      type: object
      required: [id, taskId, authorPersonId, body, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        authorPersonId:
          type: string
          format: uuid
          nullable: true
          description: Null when the author's person record is gone.
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCommentInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000

    TaskCommentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TaskComment"

    TaskFieldChange:
      type: object
      required: [from, to]
      properties:
        from:
          description: Value before (null when unset). Ids stay ids; the client names them.
          nullable: true
        to:
          description: Value after (null when cleared).
          nullable: true

    TaskHistoryEntry:
      type: object
      required: [id, action, actorPersonId, changes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [created, updated]
        actorPersonId:
          type: string
          format: uuid
          nullable: true
          description: Who did it; null for changes made without a signed-in account.
        changes:
          type: object
          description: >
            Changed fields (title, description, status, priority, milestoneId,
            parentId, startDate, dueDate, estimateManDays, assignments, tags,
            blockedByIds), each with its value before and after. Empty for
            "created".
          additionalProperties:
            $ref: "#/components/schemas/TaskFieldChange"
        createdAt:
          type: string
          format: date-time

    TaskHistory:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TaskHistoryEntry"

    NotificationType:
      type: string
      enum: [mention, assignment, status_change, review_request, approval, deadline, system]

    Notification:
      type: object
      required: [id, type, title, body, link, readAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
        body:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
          description: Path in the app to open, e.g. /projects/{id}?task={taskId}.
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [data, unreadCount]
