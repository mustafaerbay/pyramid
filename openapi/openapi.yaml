openapi: 3.0.3
info:
  title: Pyramid API
  version: 0.1.0
  description: >
    All-in-one management system for a software department.
    This OpenAPI document is the single source of truth for the API contract:
    Go server types (Gin) and TypeScript client types (Svelte) are both
    generated from it, so the two stay in lockstep.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
  - name: people

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List people
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PersonStatus"
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/people/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person by id
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ---- Shared enums (mirror db/schema.sql enum types) ----
    EmploymentType:
      type: string
      enum: [full_time, part_time, contractor, intern]
    SeniorityLevel:
      type: string
      enum: [intern, junior, mid, senior, staff, principal, lead, manager, director]
    PersonStatus:
      type: string
      enum: [active, on_leave, offboarding, inactive]

    # ---- System ----
    Health:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: string

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

    # ---- People ----
    Person:
      type: object
      required: [id, firstName, lastName, email, employmentType, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        seniority:
          allOf: [{ $ref: "#/components/schemas/SeniorityLevel" }]
          nullable: true
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        location:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        weeklyCapacityHours:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date

    PersonUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date

    PersonList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        pagination:
          $ref: "#/components/schemas/Pagination"
