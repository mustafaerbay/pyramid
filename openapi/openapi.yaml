openapi: 3.0.3
info:
  title: Pyramid API
  version: 0.1.0
  description: >
    All-in-one management system for a software department.
    This OpenAPI document is the single source of truth for the API contract:
    Go server types (Gin) and TypeScript client types (Svelte) are both
    generated from it, so the two stay in lockstep.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
  - name: people
  - name: projects
  - name: project-members
  - name: milestones
  - name: goals
  - name: leave
  - name: contributions

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness/readiness probe
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List people
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PersonStatus"
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of people
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/people/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person by id
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectStatus"
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by id
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/project-members:
    get:
      operationId: listProjectMembers
      tags: [project-members]
      summary: List project memberships
      description: >
        Filter by projectId to see a project's team, or by personId to see
        every project a person is assigned to (useful for spotting
        over-allocation before adding someone to another project).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: personId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProjectRole"
      responses:
        "200":
          description: A page of project memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProjectMember
      tags: [project-members]
      summary: Assign a person to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/project-members/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getProjectMember
      tags: [project-members]
      summary: Get a project membership by id
      responses:
        "200":
          description: The project membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateProjectMember
      tags: [project-members]
      summary: Update a project membership (role, allocation, or departure date)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteProjectMember
      tags: [project-members]
      summary: Remove a person from a project
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List milestones
      description: >
        Filter by projectId to see a single project's milestones (the usual
        case — the project dashboard's monthly timeline uses this).
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MilestoneStatus"
      responses:
        "200":
          description: A page of milestones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MilestoneList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createMilestone
      tags: [milestones]
      summary: Create a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getMilestone
      tags: [milestones]
      summary: Get a milestone by id
      responses:
        "200":
          description: The milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateMilestone
      tags: [milestones]
      summary: Update a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MilestoneUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteMilestone
      tags: [milestones]
      summary: Delete a milestone
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/GoalStatus"
      responses:
        "200":
          description: A page of goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/goals/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal by id
      responses:
        "200":
          description: The goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/leave-requests:
    get:
      operationId: listLeaveRequests
      tags: [leave]
      summary: List leave requests
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeaveStatus"
        - name: personId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of leave requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequestList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createLeaveRequest
      tags: [leave]
      summary: Create a leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/leave-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getLeaveRequest
      tags: [leave]
      summary: Get a leave request by id
      responses:
        "200":
          description: The leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateLeaveRequest
      tags: [leave]
      summary: Update a leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteLeaveRequest
      tags: [leave]
      summary: Delete a leave request
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/contributions:
    get:
      operationId: listContributions
      tags: [contributions]
      summary: List contributions
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContributionType"
        - name: personId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A page of contributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionList"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createContribution
      tags: [contributions]
      summary: Log a contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"

  /api/v1/contributions/{id}:
    parameters:
      - $ref: "#/components/parameters/IdParam"
    get:
      operationId: getContribution
      tags: [contributions]
      summary: Get a contribution by id
      responses:
        "200":
          description: The contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateContribution
      tags: [contributions]
      summary: Update a contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteContribution
      tags: [contributions]
      summary: Delete a contribution
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ---- Shared enums (mirror db/schema.sql enum types) ----
    EmploymentType:
      type: string
      enum: [full_time, part_time, contractor, intern]
    SeniorityLevel:
      type: string
      enum: [intern, junior, mid, senior, staff, principal, lead, manager, director]
    PersonStatus:
      type: string
      enum: [active, on_leave, offboarding, inactive]

    # ---- System ----
    Health:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: string

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

    # ---- People ----
    Person:
      type: object
      required: [id, firstName, lastName, email, employmentType, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        seniority:
          allOf: [{ $ref: "#/components/schemas/SeniorityLevel" }]
          nullable: true
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        location:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        weeklyCapacityHours:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date

    PersonUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date

    PersonList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Projects ----
    ProjectStatus:
      type: string
      enum: [planning, active, on_hold, completed, cancelled]
    ProjectPriority:
      type: string
      enum: [low, medium, high, critical]
    ProjectHealth:
      type: string
      enum: [on_track, at_risk, off_track]

    Project:
      type: object
      required: [id, key, name, status, priority, health, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        health:
          $ref: "#/components/schemas/ProjectHealth"
        leadId:
          type: string
          format: uuid
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
