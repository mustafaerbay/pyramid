components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ---- Shared enums (mirror db/schema.sql enum types) ----
    EmploymentType:
      type: string
      enum: [full_time, part_time, contractor, intern]
    SeniorityLevel:
      type: string
      enum: [intern, junior, mid, senior, staff, principal, lead, manager, director]
    PersonStatus:
      type: string
      enum: [active, on_leave, offboarding, inactive]

    # ---- System ----
    Health:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: string

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

    # ---- People ----
    Person:
      type: object
      required: [id, firstName, lastName, email, employmentType, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        seniority:
          allOf: [{ $ref: "#/components/schemas/SeniorityLevel" }]
          nullable: true
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        location:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        weeklyCapacityHours:
          type: number
          format: double
          nullable: true
        monthlyCapacityManDays:
          type: number
          format: double
          description: Man-days this person can work in a month (default 20).
        monthManDays:
          type: number
          format: double
          readOnly: true
          description: >
            Man-days planned for this person in the current calendar month —
            each task assignment's man-days spread over the task's working
            days (see GET /api/v1/capacity). Computed server-side.
        workloadPct:
          type: number
          format: double
          readOnly: true
          description: >
            monthManDays ÷ this month's capacity × 100, where this month's
            capacity is monthlyCapacityManDays reduced by approved leave days.
            Can exceed 100 when over-planned. Computed server-side; returned
            by list and get.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date
        monthlyCapacityManDays:
          type: number
          format: double
          minimum: 0
          maximum: 31

    PersonUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date
        monthlyCapacityManDays:
          type: number
          format: double
          minimum: 0
          maximum: 31

    PersonList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Projects ----
    ProjectStatus:
      type: string
      enum: [planning, active, on_hold, completed, cancelled]
    ProjectPriority:
      type: string
      enum: [low, medium, high, critical]
    ProjectHealth:
      type: string
      enum: [on_track, at_risk, off_track]

    Project:
      type: object
      required: [id, key, name, status, priority, health, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        health:
          $ref: "#/components/schemas/ProjectHealth"
        leadId:
          type: string
          format: uuid
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        targetDate:
          type: string
          format: date
          nullable: true
        # Stakeholder / reporting metadata block — shown in its own group in
        # the project header on the detail page, edited via a dedicated
        # "Edit project info" modal separate from the core fields above.
        # All optional; all free text except the two team-size counts.
        sponsor:
          type: string
          nullable: true
        projectDirector:
          type: string
          nullable: true
        reportPeriod:
          type: string
          nullable: true
        hqPm:
          type: string
          nullable: true
        turkeyPm:
          type: string
          nullable: true
        chineseInterface:
          type: string
          nullable: true
        hqInterface:
          type: string
          nullable: true
        turkeyQa:
          type: string
          nullable: true
        accountName:
          type: string
          nullable: true
        hqSe:
          type: string
          nullable: true
        turkeySe:
          type: string
          nullable: true
        projectCode:
          type: string
          nullable: true
        teamSizeActual:
          type: integer
          nullable: true
        teamSizePlanned:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        leadId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date

    ProjectUpdate:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        health:
          $ref: "#/components/schemas/ProjectHealth"
        leadId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
        sponsor:
          type: string
          nullable: true
        projectDirector:
          type: string
          nullable: true
        reportPeriod:
          type: string
          nullable: true
        hqPm:
          type: string
          nullable: true
        turkeyPm:
          type: string
          nullable: true
        chineseInterface:
          type: string
          nullable: true
        hqInterface:
          type: string
          nullable: true
        turkeyQa:
          type: string
          nullable: true
        accountName:
          type: string
          nullable: true
        hqSe:
          type: string
          nullable: true
        turkeySe:
          type: string
          nullable: true
        projectCode:
          type: string
          nullable: true
        teamSizeActual:
          type: integer
          nullable: true
        teamSizePlanned:
          type: integer
          nullable: true

    ProjectList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Project Members ----
    ProjectRole:
      type: string
      enum:
        [
          lead,
          maintainer,
          contributor,
          reviewer,
          stakeholder,
          project_manager,
          cie,
          backend_engineer,
          frontend_engineer,
          devops_engineer,
        ]

    ProjectMember:
      type: object
      required: [id, projectId, personId, role, allocationPct, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectRole"
        allocationPct:
          type: number
          format: double
        joinedAt:
          type: string
          format: date
        leftAt:
          type: string
          format: date
          nullable: true

    ProjectMemberCreate:
      type: object
      required: [projectId, personId]
      properties:
        projectId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/ProjectRole"
        allocationPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
        joinedAt:
          type: string
          format: date

    ProjectMemberUpdate:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/ProjectRole"
        allocationPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
        joinedAt:
          type: string
          format: date
        leftAt:
          type: string
          format: date

    ProjectMemberList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Project kickoffs ----
    # Fields map 1:1 onto the sections of the standard kickoff-meeting-agenda
    # template: meeting info, vision & business goals, target audience &
    # value proposition, constraints/risks/compliance, governance &
    # communication, next steps & action items.
    KickoffActionItem:
      type: object
      required: [id, description, createdAt]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        ownerId:
          type: string
          format: uuid
          nullable: true
        taskId:
          type: string
          format: uuid
          nullable: true
          description: Set once this action item has been converted into a real task.
        createdAt:
          type: string
          format: date-time

    KickoffActionItemInput:
      type: object
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
        ownerId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid

    ProjectKickoff:
      type: object
      required: [id, projectId, actionItems, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        meetingDate:
          type: string
          format: date
          nullable: true
        facilitatorId:
          type: string
          format: uuid
          nullable: true
        attendees:
          type: string
          nullable: true
        businessProblem:
          type: string
          nullable: true
        successDefinition:
          type: string
          nullable: true
        primaryUsers:
          type: string
          nullable: true
        painPoints:
          type: string
          nullable: true
        mvpFeature:
          type: string
          nullable: true
        constraintsNotes:
          type: string
          nullable: true
        biggestRisk:
          type: string
          nullable: true
        signOffOwner:
          type: string
          nullable: true
        meetingCadence:
          type: string
          nullable: true
        primaryTools:
          type: string
          nullable: true
        nextSessionDate:
          type: string
          format: date
          nullable: true
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/KickoffActionItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectKickoffCreate:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
          format: uuid
        meetingDate:
          type: string
          format: date
        facilitatorId:
          type: string
          format: uuid
        attendees:
          type: string
        businessProblem:
          type: string
        successDefinition:
          type: string
        primaryUsers:
          type: string
        painPoints:
          type: string
        mvpFeature:
          type: string
        constraintsNotes:
          type: string
        biggestRisk:
          type: string
        signOffOwner:
          type: string
        meetingCadence:
          type: string
        primaryTools:
          type: string
        nextSessionDate:
          type: string
          format: date
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/KickoffActionItemInput"

    ProjectKickoffUpdate:
      type: object
      properties:
        meetingDate:
          type: string
          format: date
        facilitatorId:
          type: string
          format: uuid
        attendees:
          type: string
        businessProblem:
          type: string
        successDefinition:
          type: string
        primaryUsers:
          type: string
        painPoints:
          type: string
        mvpFeature:
          type: string
        constraintsNotes:
          type: string
        biggestRisk:
          type: string
        signOffOwner:
          type: string
        meetingCadence:
          type: string
        primaryTools:
          type: string
        nextSessionDate:
          type: string
          format: date
        actionItems:
          type: array
          description: >
            Present (even as an empty array) replaces the whole action-item
            set. Omit the field entirely to leave existing action items
            untouched — same replace-whole-set convention as
            TaskUpdate.assigneeIds.
          items:
            $ref: "#/components/schemas/KickoffActionItemInput"

    ProjectKickoffList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectKickoff"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Milestones ----
    MilestoneStatus:
      type: string
      enum: [pending, in_progress, completed, missed]

    Milestone:
      type: object
      required: [id, projectId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/MilestoneStatus"
        startDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        completedAt:
          type: string
          format: date
          nullable: true
        versionId:
          type: string
          format: uuid
          nullable: true
          description: The version (release) this milestone is planned into.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MilestoneCreate:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        versionId:
          type: string
          format: uuid
          description: Must belong to the same project (400 otherwise).

    MilestoneUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/MilestoneStatus"
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        completedAt:
          type: string
          format: date
        versionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Omit to leave unchanged, send null to unassign, or a version id of
            the same project (400 otherwise).

    MilestoneList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Milestone"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Versions ----
    VersionStatus:
      type: string
      enum: [planned, in_progress, released, cancelled]

    Version:
      type: object
      required: [id, projectId, name, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/VersionStatus"
        targetDate:
          type: string
          format: date
          nullable: true
        releasedAt:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VersionCreate:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        targetDate:
          type: string
          format: date

    VersionUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: "#/components/schemas/VersionStatus"
        targetDate:
          type: string
          format: date
        releasedAt:
          type: string
          format: date

    VersionList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Version"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Weekly summaries ----
    WeeklySummary:
      type: object
      required: [id, projectId, weekOf, summary, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        weekOf:
          type: string
          format: date
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WeeklySummaryCreate:
      type: object
      required: [projectId, weekOf, summary]
      properties:
        projectId:
          type: string
          format: uuid
        weekOf:
          type: string
          format: date
        summary:
          type: string
          minLength: 1

    WeeklySummaryUpdate:
      type: object
      properties:
        weekOf:
          type: string
          format: date
        summary:
          type: string
          minLength: 1

    WeeklySummaryList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WeeklySummary"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Tasks ----
    TaskStatus:
      type: string
      enum: [backlog, todo, in_progress, in_review, blocked, done, cancelled]

    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]

    Task:
      type: object
      required: [id, projectId, number, title, status, priority, assigneeIds, assignments, manDays, tags, blockedByIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
          description: >
            The task this one is a subtask of (same project, one level deep).
            A task that has subtasks doesn't count its own man-days toward
            capacity; its subtasks carry the work.
        number:
          type: integer
          description: Per-project sequential number, e.g. 42 for "PYR-42".
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: People assigned to this task. Empty array means unassigned.
          items:
            type: string
            format: uuid
        assignments:
          type: array
          description: Each assignee's share of the task's man-days.
          items:
            $ref: "#/components/schemas/TaskAssignment"
        estimateManDays:
          type: number
          format: double
          nullable: true
          description: The task's man-day size as entered on the task itself, before (or without) splitting it across assignees.
        manDays:
          type: number
          format: double
          description: >
            Total man-days: the sum of assignments when they carry any
            man-days, otherwise estimateManDays (0 when neither). Computed
            server-side.
        startDate:
          type: string
          format: date
          nullable: true
          description: Planned start; man-days are spread over the working days from startDate to dueDate.
        dueDate:
          type: string
          format: date
          nullable: true
        blockedByIds:
          type: array
          description: >
            Tasks that must be finished before this one can be (same
            project). Sorted by task number.
          items:
            type: string
            format: uuid
        tags:
          type: array
          description: The task's tags, sorted alphabetically (case-insensitive). Tags are shared across all projects.
          items:
            type: string
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskCreate:
      type: object
      required: [projectId, title]
      properties:
        projectId:
          type: string
          format: uuid
        milestoneId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          description: Make this a subtask of that task (same project; the parent can't itself be a subtask).
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: People to assign at creation. Defaults to none if omitted.
          items:
            type: string
            format: uuid
        assignments:
          type: array
          description: >
            Replaces the full assignee set with these people and man-days.
            Takes precedence over assigneeIds when both are sent.
          items:
            $ref: "#/components/schemas/TaskAssignment"
        estimateManDays:
          type: number
          format: double
          minimum: 0
          maximum: 9999
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        blockedByIds:
          type: array
          description: >
            Tasks this one waits on. Every id must be another task in the same
            project, and the links may not form a loop.
          maxItems: 50
          items:
            type: string
            format: uuid
        tags:
          type: array
          description: >
            Tags to put on the task. Defaults to none. Each tag is trimmed, 1–40 characters; duplicates
            (ignoring case) are dropped; at most 20 tags. A tag that
            matches an existing one ignoring case reuses its spelling.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40

    TaskUpdate:
      type: object
      properties:
        milestoneId:
          type: string
          format: uuid
          nullable: true
        parentId:
          type: string
          format: uuid
          nullable: true
          description: >
            Set to make this a subtask (same project; not allowed when the
            parent is a subtask or this task has subtasks), null to make it a
            top-level task again, or omit to leave unchanged.
        title:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeIds:
          type: array
          description: >
            Replaces the full assignee set when present — send every
            assignee the task should have, or an empty array to unassign
            everyone. Omit the field entirely to leave assignees unchanged.
          items:
            type: string
            format: uuid
        assignments:
          type: array
          description: >
            Replaces the full assignee set with these people and man-days.
            Takes precedence over assigneeIds when both are sent.
          items:
            $ref: "#/components/schemas/TaskAssignment"
        estimateManDays:
          type: number
          format: double
          minimum: 0
          maximum: 9999
        startDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        blockedByIds:
          type: array
          description: >
            Replaces the full set when present (empty array clears it); omit to leave unchanged. Every id must be another task in the same
            project, and the links may not form a loop.
          maxItems: 50
          items:
            type: string
            format: uuid
        tags:
          type: array
          description: >
            Replaces the task's full tag set when present (an empty array removes all tags). Omit to leave tags unchanged. Each tag is trimmed, 1–40 characters; duplicates
            (ignoring case) are dropped; at most 20 tags. A tag that
            matches an existing one ignoring case reuses its spelling.
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40

    TagList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: string

    TaskAssignment:
      type: object
      required: [personId, manDays]
      properties:
        personId:
          type: string
          format: uuid
        manDays:
          type: number
          format: double
          minimum: 0
          maximum: 999
        availableDays:
          type: integer
          nullable: true
          readOnly: true
          description: >
            Working days (Mon–Fri, minus the person's approved leave) between
            the task's start and due dates. Null when the task doesn't have
            both dates. manDays above this means the share can't be done in
            time. Ignored on input.

    CapacityReport:
      type: object
      required: [month, workingDays, capacityManDays, plannedManDays, people, projects]
      properties:
        month:
          type: string
          description: YYYY-MM
          example: "2026-11"
        workingDays:
          type: integer
          description: Mon–Fri days in the month.
        capacityManDays:
          type: number
          format: double
          description: >
            Sum of the people's capacity for this month (active and on-leave
            people), after taking out their approved leave days.
        plannedManDays:
          type: number
          format: double
          description: Man-days of non-cancelled tasks (on non-cancelled projects) falling in this month.
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonCapacity"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectLoad"

    PersonCapacity:
      type: object
      required: [personId, capacityManDays, leaveDays, plannedManDays]
      properties:
        personId:
          type: string
          format: uuid
        capacityManDays:
          type: number
          format: double
          description: >
            monthlyCapacityManDays × (working days − leave days) ÷ working days.
        leaveDays:
          type: integer
          description: Mon–Fri days of approved leave in this month.
        plannedManDays:
          type: number
          format: double

    ProjectLoad:
      type: object
      required: [projectId, plannedManDays]
      properties:
        projectId:
          type: string
          format: uuid
        plannedManDays:
          type: number
          format: double

    PersonWorkload:
      type: object
      required: [personId, year, capacityManDays, months]
      properties:
        personId:
          type: string
          format: uuid
        year:
          type: integer
        capacityManDays:
          type: number
          format: double
          description: The person's monthly capacity before leave.
        months:
          type: array
          items:
            $ref: "#/components/schemas/PersonWorkloadMonth"

    PersonWorkloadMonth:
      type: object
      required: [month, workingDays, leaveDays, capacityManDays, plannedManDays, projects, tasks]
      properties:
        month:
          type: string
          description: YYYY-MM
        workingDays:
          type: integer
        leaveDays:
          type: integer
          description: Mon–Fri days of approved leave in this month.
        capacityManDays:
          type: number
          format: double
          description: >
            Capacity for this month after approved leave: monthly capacity ×
            (working days − leave days) ÷ working days.
        plannedManDays:
          type: number
          format: double
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectLoad"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/PersonWorkloadTask"

    PersonWorkloadTask:
      type: object
      required: [taskId, projectId, title, status, manDays, monthManDays]
      properties:
        taskId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        manDays:
          type: number
          format: double
          description: This person's man-days on the task (all months).
        monthManDays:
          type: number
          format: double
          description: >
            The part of manDays that falls in this month. Spread over the
            working days in the task's window the person isn't on leave.
        startDate:
          type: string
          format: date
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        availableDays:
          type: integer
          nullable: true
          description: >
            Working days the person isn't on leave between the task's start
            and due dates (null without both dates). manDays above this
            means the task can't be done in time.

    TaskList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        pagination:
          $ref: "#/components/schemas/Pagination"

