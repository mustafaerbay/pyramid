components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # ---- Shared enums (mirror db/schema.sql enum types) ----
    EmploymentType:
      type: string
      enum: [full_time, part_time, contractor, intern]
    SeniorityLevel:
      type: string
      enum: [intern, junior, mid, senior, staff, principal, lead, manager, director]
    PersonStatus:
      type: string
      enum: [active, on_leave, offboarding, inactive]

    # ---- System ----
    Health:
      type: object
      required: [status, time]
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        details:
          type: string

    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64

    # ---- People ----
    Person:
      type: object
      required: [id, firstName, lastName, email, employmentType, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        seniority:
          allOf: [{ $ref: "#/components/schemas/SeniorityLevel" }]
          nullable: true
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
          nullable: true
        managerId:
          type: string
          format: uuid
          nullable: true
        location:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        weeklyCapacityHours:
          type: number
          format: double
          nullable: true
        monthlyCapacityManDays:
          type: number
          format: double
          description: Man-days this person can work in a month (default 20).
        monthManDays:
          type: number
          format: double
          readOnly: true
          description: >
            Man-days planned for this person in the current calendar month —
            each task assignment's man-days spread over the task's working
            days (see GET /api/v1/capacity). Computed server-side.
        workloadPct:
          type: number
          format: double
          readOnly: true
          description: >
            monthManDays ÷ this month's capacity × 100, where this month's
            capacity is monthlyCapacityManDays reduced by approved leave days.
            Can exceed 100 when over-planned. Computed server-side; returned
            by list and get.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date
        monthlyCapacityManDays:
          type: number
          format: double
          minimum: 0
          maximum: 31

    PersonUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        title:
          type: string
        seniority:
          $ref: "#/components/schemas/SeniorityLevel"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/PersonStatus"
        departmentId:
          type: string
          format: uuid
        managerId:
          type: string
          format: uuid
        location:
          type: string
        timezone:
          type: string
        hireDate:
          type: string
          format: date
        monthlyCapacityManDays:
          type: number
          format: double
          minimum: 0
          maximum: 31

    PersonList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Projects ----
    ProjectStatus:
      type: string
      enum: [planning, active, on_hold, completed, cancelled]
    ProjectPriority:
      type: string
      enum: [low, medium, high, critical]
    ProjectHealth:
      type: string
      enum: [on_track, at_risk, off_track]

    CardRule:
      type: object
      required: [field, value, color]
      properties:
        field:
          type: string
          enum: [priority, type, tag, overdue, blocked, assignee]
          description: overdue and blocked match on value "true".
        value:
          type: string
        color:
          $ref: "#/components/schemas/WorkItemTypeColor"

    BoardSettings:
      type: object
      required: [wipLimits, swimlanes, cardColor]
      properties:
        wipLimits:
          type: object
          description: Most items allowed in a board column at once (1–999), by workflow state key. Missing = no limit.
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 999
        swimlanes:
          type: string
          enum: [none, assignee, priority, type, parent]
          description: Split the board into rows by this field.
        cardColor:
          type: string
          enum: [none, type, priority]
          description: Colour the edge of each card by this field.
        splitColumns:
          type: array
          description: States whose column is split into Doing and Done.
          items:
            type: string
        definitionOfDone:
          type: object
          description: Per state, what has to be true before an item leaves the column (up to 500 characters).
          additionalProperties:
            type: string
        cardFields:
          type: array
          description: >
            What cards show: any of assignees, manDays, points, due, tags,
            priority, parent, remaining, or custom:<field key>. Missing =
            the defaults (assignees, manDays, points, due, tags, priority, parent).
          items:
            type: string
        tagColors:
          type: object
          description: Colour per tag on this board.
          additionalProperties:
            $ref: "#/components/schemas/WorkItemTypeColor"
        cardRules:
          type: array
          description: First matching rule tints the card.
          maxItems: 20
          items:
            $ref: "#/components/schemas/CardRule"

    WorkItemRules:
      type: object
      required: [requiredByState, defaults, readOnly]
      description: >
        Field names are custom field keys or the built-ins assignees,
        dueDate, startDate, storyPoints, manDays, description, area, sprint,
        tags.
      properties:
        requiredByState:
          type: object
          description: For a workflow state key, the fields an item needs before it can be in that state.
          additionalProperties:
            type: array
            items:
              type: string
        defaults:
          type: object
          description: Values new items get when they don't say otherwise (priority, storyPoints or a custom field key).
          additionalProperties: {}
        readOnly:
          type: array
          description: Custom field keys only managers and admins can change after the item is created.
          items:
            type: string

    WorkItemTypeColor:
      type: string
      enum: [orange, violet, sky, red, amber, emerald, pink, slate]

    WorkItemTypeDef:
      type: object
      required: [key, label, base, color]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
        label:
          type: string
          minLength: 1
          maxLength: 30
        base:
          $ref: "#/components/schemas/TaskType"
        color:
          $ref: "#/components/schemas/WorkItemTypeColor"

    WorkflowState:
      type: object
      required: [key, label, category]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
        label:
          type: string
          minLength: 1
          maxLength: 40
        category:
          $ref: "#/components/schemas/TaskStatus"

    CustomField:
      type: object
      required: [key, label, type, required]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: Stable id of the field, used in Task.customValues.
        label:
          type: string
          minLength: 1
          maxLength: 60
        type:
          type: string
          enum: [text, number, date, select]
        options:
          type: array
          description: Choices of a select field (1–50, unique).
          items:
            type: string
        required:
          type: boolean

    Project:
      type: object
      required: [rules, restricted, workItemTypes, workflow, customFields, boardSettings, id, key, name, status, priority, health, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        rules:
          $ref: "#/components/schemas/WorkItemRules"
        restricted:
          type: boolean
          description: Only project members with write access (and managers/admins) can change it.
        workItemTypes:
          type: array
          description: >
            The project's own work item types (up to 20), each behaving like
            its base type for levels and capacity. A type still used by items
            can't be removed.
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkItemTypeDef"
        workflow:
          type: array
          description: >
            The project's states in board order (1–20). Each belongs to a
            category (a TaskStatus) that capacity, sprints and charts use.
            Needs a "done" state and one that isn't done or cancelled; a state
            still used by items can't be removed.
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkflowState"
        customFields:
          type: array
          description: Extra fields every work item in this project has (up to 20).
          maxItems: 20
          items:
            $ref: "#/components/schemas/CustomField"
        boardSettings:
          $ref: "#/components/schemas/BoardSettings"
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ProjectStatus"
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        health:
          $ref: "#/components/schemas/ProjectHealth"
        leadId:
          type: string
          format: uuid
          nullable: true
        startDate:
          type: string
          format: date
          nullable: true
        targetDate:
          type: string
          format: date
          nullable: true
        # Stakeholder / reporting metadata block — shown in its own group in
        # the project header on the detail page, edited via a dedicated
        # "Edit project info" modal separate from the core fields above.
        # All optional; all free text except the two team-size counts.
        sponsor:
          type: string
          nullable: true
        projectDirector:
          type: string
          nullable: true
        reportPeriod:
          type: string
          nullable: true
        hqPm:
          type: string
          nullable: true
        turkeyPm:
          type: string
          nullable: true
        chineseInterface:
          type: string
          nullable: true
        hqInterface:
          type: string
          nullable: true
        turkeyQa:
          type: string
          nullable: true
        accountName:
          type: string
          nullable: true
        hqSe:
          type: string
          nullable: true
        turkeySe:
          type: string
          nullable: true
        projectCode:
          type: string
          nullable: true
        teamSizeActual:
          type: integer
          nullable: true
        teamSizePlanned:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        leadId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date

    ProjectUpdate:
      type: object
      properties:
        key:
          type: string
        rules:
          $ref: "#/components/schemas/WorkItemRules"
        restricted:
          type: boolean
          description: Only project members with write access (and managers/admins) can change it.
        workItemTypes:
          type: array
          description: >
            The project's own work item types (up to 20), each behaving like
            its base type for levels and capacity. A type still used by items
            can't be removed.
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkItemTypeDef"
        workflow:
          type: array
          description: >
            The project's states in board order (1–20). Each belongs to a
            category (a TaskStatus) that capacity, sprints and charts use.
            Needs a "done" state and one that isn't done or cancelled; a state
            still used by items can't be removed.
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/WorkflowState"
        customFields:
          type: array
          description: Extra fields every work item in this project has (up to 20).
          maxItems: 20
          items:
            $ref: "#/components/schemas/CustomField"
        boardSettings:
          $ref: "#/components/schemas/BoardSettings"
        name:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        priority:
          $ref: "#/components/schemas/ProjectPriority"
        health:
          $ref: "#/components/schemas/ProjectHealth"
        leadId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        targetDate:
          type: string
          format: date
        sponsor:
          type: string
          nullable: true
        projectDirector:
          type: string
          nullable: true
        reportPeriod:
          type: string
          nullable: true
        hqPm:
          type: string
          nullable: true
        turkeyPm:
          type: string
          nullable: true
        chineseInterface:
          type: string
          nullable: true
        hqInterface:
          type: string
          nullable: true
        turkeyQa:
          type: string
          nullable: true
        accountName:
          type: string
          nullable: true
        hqSe:
          type: string
          nullable: true
        turkeySe:
          type: string
          nullable: true
        projectCode:
          type: string
          nullable: true
        teamSizeActual:
          type: integer
          nullable: true
        teamSizePlanned:
          type: integer
          nullable: true

    ProjectList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ---- Project Members ----
    ProjectRole:
      type: string
      enum:
        [
          lead,
          maintainer,
          contributor,
          reviewer,
          stakeholder,
          project_manager,
          cie,
          backend_engineer,
          frontend_engineer,
          devops_engineer,
        ]

    ProjectMember:
      type: object
      required: [access, id, projectId, personId, role, allocationPct, joinedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        access:
          type: string
          enum: [read, write]
          description: In a restricted project, read members can't change anything.
        role:
          $ref: "#/components/schemas/ProjectRole"
        allocationPct:
          type: number
          format: double
        joinedAt:
          type: string
          format: date
        leftAt:
          type: string
          format: date
          nullable: true

    ProjectMemberCreate:
      type: object
      required: [projectId, personId]
      properties:
        projectId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        access:
          type: string
          enum: [read, write]
          description: In a restricted project, read members can't change anything.
        role:
          $ref: "#/components/schemas/ProjectRole"
        allocationPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
        joinedAt:
          type: string
          format: date

    ProjectMemberUpdate:
      type: object
      properties:
        access:
          type: string
          enum: [read, write]
          description: In a restricted project, read members can't change anything.
        role:
          $ref: "#/components/schemas/ProjectRole"
        allocationPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
        joinedAt:
          type: string
          format: date
        leftAt:
          type: string
          format: date

    ProjectMemberList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMember"
        pagination:
          $ref: "#/components/schemas/Pagination"

