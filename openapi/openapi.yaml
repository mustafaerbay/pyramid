          format: uuid
        description:
          type: string
        ownerId:
          type: string
          format: uuid
          nullable: true
        taskId:
          type: string
          format: uuid
          nullable: true
          description: Set once this action item has been converted into a real task.
        createdAt:
          type: string
          format: date-time

    KickoffActionItemInput:
      type: object
      required: [description]
