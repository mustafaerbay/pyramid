# oapi-codegen configuration.
# Generates the Go DTOs from openapi/openapi.yaml. The output path is passed
# on the command line (-o) so this config works from `make generate` and from
# `go generate ./...`. openapi.yaml is the single source of truth.
package: api
generate:
  models: true
output-options:
  skip-prune: true
compatibility:
  # Always name enum constants <Type><Value> (ProjectHealthOnTrack), never a
  # bare <Value> (OnTrack). Without this oapi-codegen only prefixes values
  # that collide across enums, so adding one enum value elsewhere could
  # rename constants the models/handlers depend on.
  always-prefix-enum-values: true
