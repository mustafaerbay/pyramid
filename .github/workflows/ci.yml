name: CI

# Phase 6 (Deployment & Operations) of the SDLC matrix lists "automated
# CI/CD pipelines" as a mandatory deliverable. This workflow is the CI half:
# it runs on every push/PR and gives a pass/fail signal before anything
# merges. It intentionally does not deploy anywhere yet — there is no
# hosting target defined for Pyramid, so a CD job would just be unused
# scaffolding. Add a deploy job here once that target exists.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Download modules
        run: go mod download

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -cover

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type/Svelte check
        run: npm run check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
